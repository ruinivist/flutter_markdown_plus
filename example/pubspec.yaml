name: flutter_markdown_example
description: Demonstrates how to use the flutter_markdown_plus package.
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.1"

dependencies:
  flutter:
    sdk: flutter

#  flutter_markdown_plus: ^1.0.3

  flutter_markdown_plus:
    path: ../
  markdown:
    git:
      url: https://github.com/ruinivist/dart-tools.git
      ref: main
      path: pkgs/markdown


dependency_overrides:
  flutter_markdown_plus:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/
    - fonts/jetbrains-mono/OFL.txt

  fonts:
    - family: 'Roboto Mono'
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/jetbrains-mono/JetBrainsMono-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/jetbrains-mono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: fonts/jetbrains-mono/JetBrainsMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/jetbrains-mono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: fonts/jetbrains-mono/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic

  uses-material-design: true

dartfmt:
  line_length: 120
